<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Behavior Tracking - Track Browser</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Track Browser</h1>
        </header>

        <div class="content">
            <div class="panel tracks-panel">
                <div class="filters">
                    <div class="filter-group">
                        <label>Cat ID</label>
                        <select id="filterCatId" class="filter-select">
                            <option value="">All Cats</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Track Time After</label>
                        <input type="datetime-local" id="filterTrackTimeAfter" class="filter-input">
                    </div>
                    <div class="filter-group">
                        <label>Track Time Before</label>
                        <input type="datetime-local" id="filterTrackTimeBefore" class="filter-input">
                    </div>
                </div>

                <table id="tracksTable" class="tracks-table">
                    <thead>
                        <tr class="header-row">
                            <th class="sortable" data-field="track_start_dt_tm">Timestamp</th>
                            <th class="sortable" data-field="cat_id">Name</th>
                            <th class="sortable" data-field="duration_s">Duration</th>
                        </tr>
                    </thead>
                    <tbody id="tracksBody"></tbody>
                </table>
            </div>

            <div class="panel player-panel">
                <div class="video-wrapper">
                    <video id="videoPlayer" controls playsinline webkit-playsinline>
                        <p>HTML5 video not supported</p>
                    </video>
                    <canvas id="overlayCanvas"></canvas>
                </div>
                <div class="player-metadata" aria-live="polite">
                    <div class="metadata-item">
                        <span class="metadata-label">Video</span>
                        <span id="metadataVideoName" class="metadata-value">&mdash;</span>
                    </div>
                    <div class="metadata-item">
                        <span class="metadata-label">Start</span>
                        <span id="metadataTrackStart" class="metadata-value">&mdash;</span>
                    </div>
                    <div class="metadata-item">
                        <span class="metadata-label">Stop</span>
                        <span id="metadataTrackStop" class="metadata-value">&mdash;</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
